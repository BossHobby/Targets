name: cc3d_revo_nano
manufacturer: OPEN
mcu: stm32f411
leds:
  - invert: true
    pin: PC14
  - pin: PC13
serial_ports:
  - index: 1
    rx: PB7
    tx: PB6
  - index: 2
    inverter: PC15
    rx: PA3
    tx: PA2
spi_ports:
  - index: 1
    miso: PA6
    mosi: PA7
    sck: PA5
  - index: 2
    miso: PB14
    mosi: PB15
    sck: PB13
  - index: 3
    miso: PB4
    mosi: PB5
    sck: PB3
gyro:
  port: 2
  nss: PB12
gyro_orientation: 16
fpv: PA13
pinio:
  - pin: PA13
    label: VTX power
    description: Power supply for the video transmitter
    invert: false
vbat: PA6
buzzer:
  invert: true
  pin: PC13
motor_pins:
  - PB8
  - PB9
  - PB3
  - PB10
dma:
  DSHOT_CH1:
    channel: 6
    dma: DMA2_STREAM1
    tag: TIMER1_CH1
vehicles:
  - multi
outputs:
  - pin: PB8
    caps:
      - dshot
      - pwm
  - pin: PB9
    caps:
      - dshot
      - pwm
  - pin: PB3
    caps:
      - dshot
      - pwm
  - pin: PB10
    caps:
      - dshot
      - pwm
