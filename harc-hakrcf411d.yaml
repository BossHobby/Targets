name: hakrcf411d
manufacturer: HARC
mcu: stm32f411
vehicles:
  - multi
leds:
  - pin: PC13
    invert: true
serial_ports:
  - index: 1
    rx: PA10
    tx: PA9
  - index: 2
    rx: PA3
    tx: PA2
serial_soft_ports:
  - index: 1
    rx: PB3
    tx: PA15
spi_ports:
  - index: 1
    miso: PA6
    mosi: PA7
    sck: PA5
  - index: 2
    miso: PB14
    mosi: PB15
    sck: PB13
i2c_ports:
  - index: 1
    scl: PB8
    sda: PB9
gyro:
  port: 1
  nss: PA4
gyro_orientation: 8
osd:
  port: 2
  nss: PB12
flash:
  port: 2
  nss: PA0
pinio:
  - pin: PB10
    label: PINIO 1
    invert: false
  - pin: PC14
    label: PINIO 2
    invert: false
vbat: PB0
ibat: PB1
buzzer:
  pin: PB2
motor_pins:
  - PB6
  - PB7
  - PB4
  - PB5
outputs:
  - pin: PB6
    caps:
      - dshot
      - pwm
  - pin: PB7
    caps:
      - dshot
      - pwm
  - pin: PB4
    caps:
      - dshot
      - pwm
  - pin: PB5
    caps:
      - dshot
      - pwm
baro:
  port: 1
dma:
  DSHOT_CH1:
    channel: 6
    dma: DMA2_STREAM1
    tag: TIMER1_CH1
  SPI2_RX:
    channel: 0
    dma: DMA1_STREAM3
    tag: SPI2_MISO
  SPI2_TX:
    channel: 0
    dma: DMA1_STREAM4
    tag: SPI2_MOSI
