name: cc3d_revof4
manufacturer: OPEN
mcu: stm32f405
vehicles:
  - multi
leds:
  - pin: PB5
    invert: true
  - pin: PB4
serial_ports:
  - index: 1
    inverter: PC0
    rx: PA10
    tx: PA9
  - index: 3
    rx: PB11
    tx: PB10
  - index: 4
    rx: PA1
    tx: PA0
spi_ports:
  - index: 1
    miso: PA6
    mosi: PA7
    sck: PA5
  - index: 2
    miso: PB14
    mosi: PB15
    sck: PB13
  - index: 3
    miso: PB4
    mosi: PB5
    sck: PB3
gyro:
  port: 1
  nss: PA4
gyro_orientation: 8
usb_detect: PC5
pinio:
  - pin: PA13
    label: VTX power
    description: Power supply for the video transmitter
    invert: false
fpv: PA13
vbat: PC2
buzzer:
  pin: PB6
  invert: true
motor_pins:
  - PA3
  - PA2
  - PB0
  - PB1
outputs:
  - pin: PA3
    caps:
      - dshot
      - pwm
  - pin: PA2
    caps:
      - dshot
      - pwm
  - pin: PB0
    caps:
      - dshot
      - pwm
  - pin: PB1
    caps:
      - dshot
      - pwm
dma:
  DSHOT_CH1:
    channel: 6
    dma: DMA2_STREAM1
    tag: TIMER1_CH1
  DSHOT_CH2:
    channel: 0
    dma: DMA2_STREAM6
    tag: TIMER1_CH2
